<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{page-title} | Justin Restivo</title>
    <meta name="description" content="{description}" />
    <meta name="robots" content="{robots}" />
    <link rel="canonical" href="https://justin.restivo.me{slug}" />
    <meta property="og:site_name" content="Justin Restivo's Blog" />
    <meta property="og:type" content="article" />
    <meta property="og:title" content="{page-title}" />
    <meta property="og:description" content="{description}" />
    <meta property="og:url" content="https://justin.restivo.me{slug}" />
    <meta name="twitter:card" content="summary" />
    <meta name="author" content="{author}" />
    <link rel="stylesheet" href="../assets/schemas/page.css" />
    <link rel="stylesheet" href="../assets/math-block.css" />
    <link rel="stylesheet" href="../assets/math-inline.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script src="/nav.js" defer></script>
    <link rel="stylesheet" href="/analytics.css" />
    <script src="/analytics.js" defer></script>
  </head>

  <body>
    <header>
      <nav class="header-nav" aria-label="Site">
        <span class="custom"><strong><a href="/">Justin Restivo</a></strong></span>
        <a href="/">HOME</a>
        <a href="/about.html">ABOUT</a>
        <a href="/projects.html">PROJECTS</a>
        <a href="/contact.html">CONTACT</a>
        <a href="https://github.com/DieracDelta">GITHUB</a>
        <a href="https://www.linkedin.com/in/justinprestivo">LINKEDIN</a>
      </nav>
      <hr />
    </header>
    <div id="grid-wrapper">
      <article>
        <section class="block" id="{slug@anchor}">
          <!-- <details open> -->
          <summary>
            <header>
              <h1>
                <metadata get="title" />
              </h1>
              <div class="metadata">
                <ul>
                  <li class="meta-item">Author: <metadata get="author" /></li>
                  <li class="meta-item">Date: <metadata get="date" /></li>
                </ul>
              </div>
            </header>
          </summary>
          <content />
          <!-- Where to put Content-->
          <!-- </details> -->
        </section>
        <!-- <footer></footer> -->
      </article>
      <!-- <sidebar /> -->
      <!-- Where to put sidebar -->
    </div>
    <!-- Typsite reserves the footer tag; use an explicit contentinfo landmark. -->
    <div class="site-footer" role="contentinfo" aria-label="Site footer">
      <p class="site-credits">© Justin Restivo · written in <a href="https://typst.app">Typst</a>, built with <a href="https://github.com/Glomzzz/typsite">typsite</a> · <a href="https://github.com/DieracDelta/DieracDelta.github.io">source</a> · <a href="/privacy">privacy</a></p>
    </div>
  </body>
</html>
